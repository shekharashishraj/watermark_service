name: OSCDSpike
options:
  bundleIdPrefix: edu.asu.oscd
  deploymentTarget:
    iOS: "26.0"        # splatx-metal (reference rendering) requires iOS 26
packages:
  OSCDCore:
    path: ../Packages/OSCDCore
  OSCDFusion:
    path: ../Packages/OSCDFusion
  SplatX:
    path: ../third_party/splatx-metal     # git clone https://github.com/PoSTMEDIA-AI/splatx-metal (see README)
targets:
  OSCDSpike:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Models
        optional: true
      # splatx kernels are compiled on the device at first use: Xcode 27's offline metallib
      # (file format 2.9) cannot be loaded by iOS 26.
      - path: ../third_party/splatx-metal/Sources/SplatXKernelSrc
        type: folder
        buildPhase: resources
    dependencies:
      - package: OSCDCore
      - package: SplatX
        product: SplatXTrainC
      - package: OSCDFusion
      # Brush (Apache-2.0) trainer, built for iOS from ~/projects/remus/engine/brush:
      #   cargo build --release --target aarch64-apple-ios -p brush-c
      #   cp target/aarch64-apple-ios/release/libbrush_c.a ~/Library/Caches/oscd-mobile/brush-ios/
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 3D Changes
        NSCameraUsageDescription: Scans the tabletop for change detection.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.veripheye.changes3d
        DEVELOPMENT_TEAM: 7FJWHJ5QJJ
        SWIFT_VERSION: "5.0"
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Native/BrushC
        LIBRARY_SEARCH_PATHS: $(HOME)/Library/Caches/oscd-mobile/brush-ios
        OTHER_LDFLAGS: -lbrush_c -lc++ -lresolv
schemes:
  OSCDSpike:
    build:
      targets:
        OSCDSpike: all
    run:
      config: Release        # benchmarks must run optimised; Debug builds OSCDCore at -Onone
    archive:
      config: Release
