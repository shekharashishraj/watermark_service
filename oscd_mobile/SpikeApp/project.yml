name: OSCDSpike
options:
  bundleIdPrefix: edu.asu.oscd
  deploymentTarget:
    iOS: "17.0"
packages:
  OSCDCore:
    path: ../Packages/OSCDCore
targets:
  OSCDSpike:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Models
        optional: true
    dependencies:
      - package: OSCDCore
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 3D Changes
        NSCameraUsageDescription: Scans the tabletop for change detection.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.veripheye.changes3d
        DEVELOPMENT_TEAM: 7FJWHJ5QJJ
        SWIFT_VERSION: "5.0"
schemes:
  OSCDSpike:
    build:
      targets:
        OSCDSpike: all
    run:
      config: Release        # benchmarks must run optimised; Debug builds OSCDCore at -Onone
    archive:
      config: Release
