# E4 — main robustness sweep (H1). O-SCD runs with --refine, so each run yields BOTH the online
# and the refined masks (used again in E7 / H4).
# !! The levels below are the plan's starting grid. Replace them with the grid frozen after the
# !! E3 pilot and commit PREREGISTRATION.md BEFORE running this experiment.
name: e4_main
paths: ../paths.yaml
perturbations: ../perturbations.yaml

methods:
  oscd:
    scenes: all
    pairs: [Instance_1, Instance_2]
    seeds: [0]
  mv3dcd:                                # pose protocol A (oracle COLMAP poses), 5-scene subset
    scenes: [Cantina, Printing_area, Meeting_room, Garden, Porch]
    pairs: [Instance_1, Instance_2]
    seeds: [0]

sweep:
  identity: [0]                          # severity-0 baseline with the same re-encode
  blur: [16, 32, 64, 128]
  exposure: [-2, -1, 1, 2]
  views: [0.6, 0.4, 0.2]                 # 25 -> 15 / 10 / 5 post-change views
  # tier 2 (uncomment if time allows):
  # gain_field: [0.25, 0.5, 0.75]
  # shadow: [0.3, 0.6, 0.9]

trials:
  views: 3                               # 3 random nested subsets per level
